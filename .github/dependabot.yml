version: 2

# Actions are pinned to commit SHAs (see any `uses:` line), which stops a
# retagged `@v7` from executing new code on a runner that in npm-publish.yml
# holds the publishing OIDC token — but a pin nobody moves is a pin that rots.
# This config moves them: one grouped PR that bumps the SHAs and rewrites the
# trailing version comments, which CI then judges like any other change.
#
# Monthly, not weekly. Action SHAs do not move weekly, and the review queue here
# is the real constraint — a weekly schedule mostly produces no-ops and, when it
# does fire, fires faster than anyone serves it. Grouping keeps the backlog at
# exactly one perpetually-rebased PR rather than a growing pile.
#
# npm: no version updates, only a title format for security updates. This
# repository tracks nuxt/ui and takes dependency bumps as ports of upstream's own
# (see `.sync/`), so a second stream of version PRs would compete with that
# pipeline. `open-pull-requests-limit: 0` switches version updates off; Dependabot
# security updates (a repository setting) still open PRs, and this entry is what
# gives them a conventional-commit title. Without it they are titled
# "Bump x from a to b", which the required `title` check rejects, so the PR could
# never merge. Runtime dependencies are filed as `fix(deps)` (a consumer gets the
# patch), dev dependencies as `chore(deps)`. `reka-ui` and `vaul-vue` are
# exact-pinned to upstream's versions and move only through a port.
#
# Revisit the version-updates part when the sync stops being the route for bumps.
# That pipeline is deliberately manual — there is no dispatcher and no schedule,
# so nothing fails loudly when it goes quiet. The condition to watch is the only
# observable one: if `cursor` in `.sync/nuxt-ui.json` has not advanced in a month
# while nuxt/ui@v4 has moved, raise the limit above 0 as a backstop. A decision
# that depends on someone else doing something needs to say what happens when
# they stop.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      # Conventional-commit prefix so release-please files these under CI in the
      # changelog instead of ignoring them.
      prefix: ci
    groups:
      # One PR for all of them; these actions move together and reviewing seven
      # separate SHA bumps is worse than reviewing one.
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: reka-ui
      - dependency-name: vaul-vue
