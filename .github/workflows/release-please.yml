name: Release Please 🤖

# Keeps a release PR open against main: version bump + CHANGELOG assembled from
# conventional-commit subjects. Merging it creates the tag and the GitHub
# Release; the `publish` job below then dispatches npm-publish.yml against that
# tag. Merging the release PR is the only human action: nothing waits for an
# approval (owner decision, #63).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Serialize runs the way ci.yml and deploy.yml already do. A burst of merges
# otherwise starts one full history scan per push, all racing to update the
# same release PR. cancel-in-progress stays false: a run may be mid-release.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    # Выпуск @bxshefby/b24ui-nuxt включается переменной репозитория NPM_RELEASE=true
    # (Settings → Secrets and variables → Actions → Variables); см. releasing.md.
    if: github.repository == 'bx-shef/b24-ui' && vars.NPM_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `actions: write` here: the third-party release-please-action must not
    # hold it. The two jobs below carry it instead.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr_branch: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
    steps:
      - name: Prepare release PR / create release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Gives the release PR a `ci` run that actually executes. Its own
  # pull_request run is created and then held at `action_required`, so
  # without this the PR carries no CI result at all.
  #
  # This does NOT make the PR mergeable: branch protection waits on the held
  # run, and a human has to approve that one before merging. Documented in
  # .github/contributing/releasing.md#approving-the-release-prs-ci — keep the
  # two in sync.
  ci-release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run CI on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # Dispatched, not workflow_call, for two reasons that both broke the
  # called design:
  #  - npm trusted publishing matches the token's top-level workflow_ref,
  #    which for a called workflow is THIS file, not npm-publish.yml — the
  #    publisher pin would reject the automated path with the manual one
  #    still working.
  #  - a called run inherits this run's github.sha (whatever push happened
  #    to trigger it), while `--ref <tag>` pins the publish to the exact
  #    tagged commit, even if the next PR is already merged into main.
  # A release created with GITHUB_TOKEN does not start `release` workflows, but
  # workflow_dispatch from that token does (the documented exception). This is a
  # job of its own so `actions: write` never reaches release-please-action. If
  # the dispatch fails, the release exists unpublished — recovery is rerunning
  # exactly this command by hand (releasing.md).
  publish:
    needs: release-please
    if: >-
      github.repository == 'bx-shef/b24-ui' && vars.NPM_RELEASE == 'true' &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch npm-publish.yml on the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::unexpected tag '$TAG'"; exit 1; }
          gh workflow run npm-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
