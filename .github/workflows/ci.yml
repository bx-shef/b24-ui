name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Dispatched by release-please.yml onto its release-PR branch. The bot's PR
  # does fire a pull_request event, but GitHub holds that run at
  # `action_required` awaiting manual approval, so the dispatched run is the only
  # `ci` that actually executes there. It does NOT satisfy the required check —
  # branch protection waits on the held run, which a human has to approve. See
  # .github/contributing/releasing.md#approving-the-release-prs-ci.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancelling superseded runs is only safe for PR churn. A main run may be
  # the one await-ci polls before publishing a release — cancelling it strands
  # the tag with nothing on npm.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow executes the most untrusted code in the repository — a full
# `pnpm install` with build scripts, then lint, typecheck, tests and build. It
# needs nothing but read access, and saying so keeps a `push` or dispatch run
# from inheriting a permissive repository default.
permissions:
  contents: read

jobs:
  # Everything but the unit suite. The required check is `ci` (the last job
  # below), which only goes green when `checks`, `test` and `coverage` all did.
  checks:
    runs-on: ubuntu-latest
    env:
      pnpm_config_strict_dep_builds: false
      pnpm_config_verify_deps_before_run: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24ui
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bx-shef/b24-ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two, not the default one: assert-commit-parses.mjs compares
          # `.sync/nuxt-ui.json` at HEAD against HEAD^ to tell a port from a
          # bookkeeping commit. At depth 1 it warns and skips rather than
          # passing quietly, but skipping is not what we want here.
          fetch-depth: 2

      # Pinning actions to commit SHAs is a state; this is the control that keeps
      # it. The realistic way the pins get lost is not carelessness — it is a
      # port: upstream nuxt/ui bumps actions by tag, and PR #297 replayed exactly
      # such a bump here, rewriting `uses:` from @v6 to @v7. A port that does that
      # again fails here instead of silently reopening the hole.
      - name: Assert every action is pinned to a commit SHA
        run: .github/scripts/assert-actions-pinned.py

      # pnpm freezes the lockfile by itself under CI, so this asserts an
      # intention rather than a behaviour: the flag stays written down, and
      # `--no-frozen-lockfile` cannot be slipped in to get a red build green.
      - name: Assert every workflow install is frozen
        run: .github/scripts/assert-lockfile-frozen.py

      # The job holding `id-token: write` in npm-publish.yml must run no
      # repository or dependency code (no checkout, install, build): install
      # scripts could otherwise mint an OIDC token and publish through the
      # Trusted Publisher.
      - name: Assert the publishing job runs no repository code
        run: .github/scripts/assert-publish-split.py .github/workflows/npm-publish.yml

      # Merging the release PR publishes with no approval in between: the chain
      # must dispatch npm-publish.yml on the tag, for this repository only.
      - name: Assert the release chain dispatches on the tag
        run: .github/scripts/assert-release-chain.py .github/workflows/release-please.yml

      # The workflow scripts have no other coverage: they run on a schedule and
      # hold `issues: write`. Several of the bugs three rounds of review found in
      # them shared one shape — a failure inside an `if` condition, which bash
      # exempts from errexit, so the job stays green and the outcome is wrong —
      # and that class is invisible to reading. Stubs make it reproducible in a
      # second.
      - name: Test the workflow scripts
        run: test/workflows/run.sh

      # These are the only shell and Python in a repository whose every other
      # line is linted by eslint and vue-tsc. shellcheck is preinstalled on the
      # runner, so this costs a second and is what keeps them honest when nobody
      # is reading them. Info-level notes are not failures: the `printf` format
      # strings are deliberately single-quoted, and `-x` follows the sourced
      # helper rather than warning that it cannot see it.
      - name: Shellcheck the workflow scripts
        run: shellcheck -x -S warning .github/scripts/*.sh .github/scripts/lib/*.sh test/workflows/*.sh test/workflows/stubs/*

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The whole tree — the library, docs (served publicly with its MCP server)
      # and the tooling. High and critical fail CI; one without a fix in the line
      # we can take goes into `auditConfig.ignoreGhsas` in pnpm-workspace.yaml
      # with its reason, never silently. Moderate and low are not a gate: any
      # new advisory anywhere would otherwise block every PR and the release PR
      # await-ci waits on. A registry outage is not a finding either.
      - name: Audit dependencies
        run: pnpm audit --audit-level high --ignore-registry-errors

      - name: Prepare
        run: pnpm run dev:prepare

      # release-please drops a commit it cannot parse and says so only at debug
      # level, so a missing changelog entry has no red anywhere — dcb3bacf did
      # exactly that to the 2.12.0 notes (#436).
      #
      # `push` only: ci.yml's push trigger is `branches: [main]`, so every push
      # event here is the message that actually lands. A PR's commits are usually
      # the same text, but the squash subject and body can be rewritten in the
      # merge dialog, so only the message on `main` is certain.
      - name: Assert the commit message will not be dropped from the changelog
        if: github.event_name == 'push'
        run: .github/scripts/assert-commit-parses.mjs

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # `typecheck` runs `vue-tsc --noEmit`; this runs the real declaration emit,
      # which is a different thing and fails on its own (TS2883 on the runtime
      # plugins, from #500's lockfile reshuffle, went unnoticed for three days
      # because nothing here built the module).
      - name: Build the module
        run: pnpm run build

      # Rebuilt after the module so its generated `components.d.ts` and
      # `auto-imports.d.ts` point at `dist/`: the copies `dev:prepare` wrote
      # point at `src/` through the stub, and the typecheck below would then
      # compile all of `src/` outside Nuxt, where `#imports` and `#build/*` do
      # not resolve, instead of the published declarations (#654,
      # nuxt/ui@1dbb606).
      - name: Build the Vue playground
        run: pnpm run dev:vue:build

      # `vue-tsc -b`, because the playground's `tsconfig.json` is `"files": []`
      # plus references, which plain `vue-tsc --noEmit` does not follow — the
      # step `typecheck` used to carry compiled zero files (#654).
      - name: Typecheck the Vue playground
        run: pnpm --filter ./playgrounds/vue typecheck

      # A separate invocation, not a third project in the run above. These
      # specs boot Nuxt with `loadNuxt`, and the component suite already sits
      # close to the fork heap limit — see the note in vitest.module.config.ts.
      - name: Test the module
        run: pnpm test:module

      # Everything in this job tests source: `Test` mounts components out of
      # `src/` and `Build` only proves the bundler is happy. Nothing here starts
      # an application — that is smoke.yml, on a schedule (#329).
      - name: Build
        run: pnpm build

  # The unit suite, in three parallel parts. `Test` used to be one ~4.7 min step
  # in the job above; split by vitest's own `--shard`, the longest part sets the
  # wall clock instead of the sum.
  #
  # Coverage is NOT gated here. The thresholds in `vitest.config.ts` describe the
  # whole suite, and a shard sees a third of it (each shard also counts every file
  # the other two cover as untested), so they are zeroed on the command line and
  # the `coverage` job below, which sees all three blobs, is the gate. Zeroing
  # them in the config instead would switch the gate off for local
  # `pnpm run test:coverage` too.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      pnpm_config_strict_dep_builds: false
      pnpm_config_verify_deps_before_run: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24ui
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bx-shef/b24-ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      # `--reporter=default` keeps the readable log; `blob` is what the
      # `coverage` job merges (it carries the V8 coverage of this shard too).
      - name: Test (shard ${{ matrix.shard }}/3)
        run: >-
          pnpm exec vitest run --coverage
          --shard=${{ matrix.shard }}/3
          --reporter=default --reporter=blob
          --coverage.thresholds.statements=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.lines=0

      # `.vitest` is a dot-directory, which upload-artifact skips by default.
      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Merges the three blobs and applies the thresholds from `vitest.config.ts` to
  # the whole suite — the same gate `pnpm run test:coverage` is locally. It also
  # replays every test result, so a failing test is red here as well as in its
  # shard. Needs the install and `dev:prepare` because the merge loads the same
  # config and the modules it resolves.
  #
  # `reportOnFailure` in the config keeps the report coming out when a test
  # failed, which is the run somebody wants to look at.
  coverage:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      pnpm_config_strict_dep_builds: false
      pnpm_config_verify_deps_before_run: false
      NUXT_PUBLIC_SITE_URL: https://bitrix24.github.io
      NUXT_PUBLIC_BASE_URL: /b24ui
      NUXT_PUBLIC_CANONICAL_URL: https://bitrix24.github.io
      NUXT_PUBLIC_GIT_URL: https://github.com/bx-shef/b24-ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Download the blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: .vitest/blob
          merge-multiple: true

      - name: Merge the reports and check the coverage thresholds
        run: pnpm exec vitest run --merge-reports --coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The required check. Branch protection and `npm-publish.yml` know a check
  # named `ci`; the work is spread over `checks`, `test` and `coverage`, and this
  # is the one place that says all of them passed. `if: always()` so a failed or
  # skipped need turns this red instead of leaving it skipped, which branch
  # protection would read as "not run".
  ci:
    name: ci
    needs: [checks, test, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | all(. == "success") | not' >/dev/null; then
            echo "::error::a job ci depends on did not succeed"
            exit 1
          fi
