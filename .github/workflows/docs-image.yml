name: Docs image 🐳

# Сайт документации (docs/, Nuxt-сервер) как Docker-образ ghcr.io/bx-shef/b24-ui-docs.
# push в main — сборка, дымовая проверка, публикация (latest + sha); на сервере образ подхватывает Watchtower
# (deploy/docs/README.md). PR — только сборка и дымовая проверка, если затронуто то, что в образе.
# GitHub Pages (deploy.yml) не заменяет: его выключают отдельным решением владельца (bx-shef/b24-ui#9).
#
# Адрес сайта вшивается в статику при сборке: переменная репозитория DOCS_SITE_URL (Settings → Variables)
# или поле site_url при ручном запуске; пусто — плейсхолдер https://docs.example.com.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'skills/**'
      - 'deploy/docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/docs-image.yml'
  workflow_dispatch:
    inputs:
      site_url:
        description: Адрес сайта для сборки (https://домен, без слэша на конце); пусто — переменная DOCS_SITE_URL
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: docs-image-${{ github.ref }}
  # отменяем только проверки PR: публикацию из main вытеснять нельзя
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SITE_URL: ${{ inputs.site_url || vars.DOCS_SITE_URL || 'https://docs.example.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Собрать образ
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docs/Dockerfile
          load: true
          tags: b24-ui-docs:ci
          build-args: |
            SITE_URL=${{ env.SITE_URL }}

      - name: Дымовая проверка
        shell: bash
        run: |
          docker run -d --name docs -p 127.0.0.1:3000:3000 b24-ui-docs:ci
          for i in $(seq 1 60); do curl -fs localhost:3000/llms.txt >/dev/null && break; sleep 1; done
          check() { got=$(curl -s -o /dev/null -w '%{http_code}' "${@:2}"); echo "$1 → $got  ${*:2}"; [ "$got" = "$1" ]; }
          check 200 localhost:3000/
          check 200 localhost:3000/llms.txt
          check 200 localhost:3000/sitemap.xml
          check 200 localhost:3000/docs/getting-started/
          check 200 localhost:3000/raw/docs/getting-started.md
          # MCP: список инструментов (страницу — в переменную: grep -q закрыл бы трубу раньше curl, а pipefail это ловит)
          mcp=$(curl -fs -X POST localhost:3000/mcp/ \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          grep -q '"tools":\[{"name":"' <<<"$mcp" || { echo "/mcp/: в ответе нет tools: ${mcp:0:300}"; exit 1; }
          echo "/mcp/ tools/list → tools"
          # адрес сайта из сборки дошёл до статики
          llms=$(curl -fs localhost:3000/llms.txt)
          grep -qF "$SITE_URL" <<<"$llms" || { echo "llms.txt: нет адреса $SITE_URL"; exit 1; }
          # healthcheck образа — node fetch внутри контейнера
          docker exec docs node -e "fetch('http://127.0.0.1:3000/llms.txt').then(r => process.exit(r.ok ? 0 : 1))"
          # работает не от root
          [ "$(docker exec docs id -un)" = node ]

      - name: Лог контейнера при сбое
        if: failure()
        run: docker logs docs || true

      - name: Вход в GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метки образа
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bx-shef/b24-ui-docs
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # Второй build-push берёт слои из кэша первого (тот же builder), пересборки нет
      - name: Опубликовать
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
