name: NPM publish 🚀

# Only workflow_dispatch, and only from a `v*` tag (conditions below): the
# automated path is release-please.yml dispatching this workflow with
# --ref <tag>, so the run's sha is the tagged commit and the OIDC token's
# workflow_ref stays this file — which is what npm trusted publishing pins. The
# manual recovery path is the same dispatch with the tag chosen as the ref.
# There is no `release` trigger: a hand-made release must not publish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  await-ci:
    # Только этот репозиторий, только включённый выпуск (NPM_RELEASE=true), только тег v*.
    if: >-
      github.repository == 'bx-shef/b24-ui' && vars.NPM_RELEASE == 'true' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      # A GitHub Release can be created on any commit and workflow_dispatch can
      # target any ref, but only history that went through the merge process
      # should ever reach npm. An environment branch policy cannot express this:
      # it matches ref *names*, and a release run's ref is the tag, which can
      # point at any commit — asserting the commit is merged history takes an
      # API call.
      - name: Assert ${{ github.sha }} is on main
        run: |
          # Retried: a transient API failure must not strand a tagged release,
          # and under `bash -e` an unretried $(gh api …) does exactly that.
          status=""
          for i in 1 2 3 4 5; do
            if status=$(gh api "repos/$REPO/compare/main...$SHA" --jq '.status'); then
              break
            fi
            echo "Attempt $i/5: compare API failed, retrying in 15s"
            sleep 15
          done
          echo "compare main...$SHA -> $status"
          case "$status" in
            identical|behind) echo "$SHA is merged history of main" ;;
            *) echo "$SHA is not part of main (status=$status); refusing to publish"; exit 1 ;;
          esac

      - name: Wait for ci.yml to succeed on ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0] // empty')
            if [ -z "$run" ]; then
              echo "Attempt $i/60: no ci.yml run found yet for $SHA, retrying in 30s"
              sleep 30
              continue
            fi
            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion')
            echo "Attempt $i/60: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "ci.yml succeeded on $SHA"
                exit 0
              fi
              echo "ci.yml did not succeed on $SHA (conclusion=$conclusion)"
              exit 1
            fi
            sleep 30
          done
          echo "Timed out after 30 minutes waiting for ci.yml on $SHA"
          exit 1

  # Builds and packs with NO publishing identity. Dependency install scripts
  # (puppeteer, sharp, better-sqlite3 from `allowBuilds`, needed only by the
  # docs site) run here, and a job holding `id-token: write` would expose
  # ACTIONS_ID_TOKEN_REQUEST_* to every one of them — enough to mint an OIDC
  # token and publish a rogue version through the Trusted Publisher. So this job
  # has `contents: read` only, and `publish` below never installs anything.
  build:
    needs: await-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.version-check.outputs.skip }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Build
        run: pnpm build

      # Smoke-build the dev playgrounds before publishing so a broken Nuxt or
      # Vue build blocks the release (these no longer run in PR CI).
      - name: Build Nuxt playground
        run: pnpm run dev:build

      - name: Build Vue playground
        run: pnpm run dev:vue:build

      # The trigger paths converge here. Two situations must not reach npm as
      # anything but a no-op:
      #  - a re-run for an already-published version (release recreated to fix
      #    notes, manual dispatch after the bot published) — skip, not
      #    EPUBLISHCONFLICT;
      #  - a stale run re-run out of order while a newer version already
      #    shipped — publishing it would move the `latest` dist-tag backwards,
      #    so refuse and leave a clear message instead.
      # `skip` is an output of this job: `publish` is skipped by it.
      - name: Skip if this version is already on npm or older than latest
        id: version-check
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --silent >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(npm view "$name" dist-tags.latest --silent 2>/dev/null || echo "")
          if [ -n "$latest" ]; then
            newer=$(node -p "
              const p = s => s.split('-')[0].split('.').map(Number);
              const [a, b] = [p('$version'), p('$latest')];
              let r = 0;
              for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) { r = a[i] > b[i] ? 1 : -1; break } }
              r
            ")
            if [ "$newer" = "-1" ]; then
              echo "::warning::$version is older than published latest $latest — refusing to publish a stale release. Publish manually if this is intended."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # `pnpm pack`, not `npm pack`, and this is load-bearing: since the move to
      # a pnpm catalog the on-disk manifest declares 90 dependencies as
      # `"catalog:"` (and workspace packages as `workspace:*`), and only pnpm
      # rewrites those into real ranges while packing. `publish` uploads this
      # tarball verbatim with npm, so the rewrite has to have happened here.
      # The guard below fails the build if a placeholder survived.
      - name: Pack
        id: pack
        if: steps.version-check.outputs.skip == 'false'
        shell: bash
        run: |
          mkdir -p dist-tarball
          pnpm pack --pack-destination dist-tarball
          tarball=$(ls dist-tarball)
          [ "$(echo "$tarball" | wc -l)" = "1" ] || { echo "expected exactly one tarball, got: $tarball"; exit 1; }
          if tar -xzOf "dist-tarball/$tarball" package/package.json | grep -E '"(catalog:|workspace:)'; then
            echo "::error::unresolved catalog:/workspace: protocol in the packed manifest"
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload the tarball
        if: steps.version-check.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: dist-tarball/
          if-no-files-found: error
          retention-days: 7

  # The only job with the publishing identity. It checks out nothing and runs no
  # repository or dependency code: it downloads the tarball `build` produced and
  # hands it to npm. Keep it that way — test/workflows/publish-split.test.sh
  # fails if an `id-token: write` job gains a checkout, an install or a build.
  publish:
    needs: build
    if: >-
      github.repository == 'bx-shef/b24-ui' && vars.NPM_RELEASE == 'true' &&
      needs.build.outputs.skip == 'false'
    runs-on: ubuntu-latest
    # No reviewers (owner decision, #63): merging the release PR is the approval.
    # The `npm-publish` environment still exists because the npm Trusted
    # Publisher is bound to its name; in Settings → Environments it allows only
    # `main` and `v*` (Deployment branches and tags → Selected), with no
    # Required reviewers. Which commit may reach npm is decided by `await-ci`
    # (on main, CI green), by `verify` (a tag, name and version from the tarball
    # match) and by the ref policy of the environment.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      TARBALL: ${{ needs.build.outputs.tarball }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    # Every step below is allow-listed by id in .github/scripts/assert-publish-split.py,
    # and the `run` bodies must match it character for character. Changing a step
    # here means changing the guard on purpose, in the same PR.
    steps:
      - name: Download the tarball
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: dist-tarball

      # An exact Node release whose bundled npm is already >= 11.5.1 (npm trusted
      # publishing), so nothing is upgraded inside the job that holds the token.
      # Node 24.22.3 ships npm 11.19.1 (nodejs.org/dist/index.json). Bump the pin
      # deliberately; the next step fails if the bundled npm is too old.
      - name: Install node
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          registry-url: 'https://registry.npmjs.org'

      - name: Require npm with trusted publishing support
        id: npm-version
        shell: bash
        run: |
          ver=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$ver" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $ver is older than 11.5.1 (trusted publishing); bump the pinned node-version"
            exit 1
          fi
          echo "npm $ver"

      # Only a tag may publish, and the artifact is checked rather than trusted:
      # `build` runs dependency code, so the name and version GitHub vouches for
      # (the tag) are compared with what is actually inside the tarball.
      - name: Verify the tarball
        id: verify
        shell: bash
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::publishing is only allowed from a tag, got $REF_TYPE $REF_NAME"
            exit 1
          fi
          if ! [[ "$TARBALL" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]; then
            echo "::error::unexpected tarball name"
            exit 1
          fi
          if [ "$(ls -A dist-tarball)" != "$TARBALL" ] || [ ! -f "dist-tarball/$TARBALL" ] || [ -L "dist-tarball/$TARBALL" ]; then
            echo "::error::dist-tarball must contain exactly the regular file $TARBALL"
            exit 1
          fi
          manifest=$(tar -xzOf "dist-tarball/$TARBALL" package/package.json)
          name=$(printf '%s' "$manifest" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
          version=$(printf '%s' "$manifest" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$name" != "@bxshefby/b24ui-nuxt" ]; then
            echo "::error::tarball package name is $name, expected @bxshefby/b24ui-nuxt"
            exit 1
          fi
          if [ "v$version" != "$REF_NAME" ]; then
            echo "::error::tarball version v$version does not match tag $REF_NAME"
            exit 1
          fi

      # `--provenance` is redundant today and deliberate anyway: it moves the
      # attestation from being a property of a setting on npmjs.com to being a
      # property of this file. releasing.md has the reasoning.
      #
      # `./` is load-bearing: npm reads a bare `dir/file.tgz` as the GitHub
      # shorthand `owner/repo` and runs `git ls-remote ssh://git@github.com/
      # dist-tarball/…` — the 2.16.0 publish failed exactly so.
      - name: 'Publish 🚀'
        id: publish
        shell: bash
        run: npm publish "./dist-tarball/$TARBALL" --provenance --access public
