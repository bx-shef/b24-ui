# Лимит запросов к публичному MCP (POST /mcp/ ходит в контент-базу и дороже статики). Файл в
# /etc/nginx/conf.d — уровень http (install.sh кладёт его в прокси). Ключ лимита — адрес клиента,
# но только для /mcp…: для остальных путей ключ пуст, а пустой ключ nginx не считает.
# Сам limit_req включает vhost.d/<домен>_location (шаблон mcp-location.conf).
map $request_uri $b24ui_mcp_key {
    default "";
    ~^/mcp(/|\?|$) $binary_remote_addr;
}
limit_req_zone $b24ui_mcp_key zone=b24ui_mcp:10m rate=30r/m;
