# Журнал ошибок nginx-proxy — только crit и выше (как в посадочной shef.toolsai). На уровне error nginx
# пишет «client: <IP>» и «request: "GET /…?…"» (502, 504, обрыв соединения) в тот же docker logs, мимо
# LOG_FORMAT. Файл в /etc/nginx/conf.d — уровень http (README nginx-proxy, «Proxy-wide»); в шаблоне
# nginx.tmpl своего error_log нет, поэтому этот перекрывает унаследованный из nginx.conf для всех vhost.
error_log /dev/stderr crit;
